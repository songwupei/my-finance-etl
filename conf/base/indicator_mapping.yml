# ==================== 标准科目库引用 ====================
standard_accounts_source:
  type: "yaml"
  path: "conf/base/finance_mapping_standard.yaml"
  encoding: "utf-8"

# ==================== 报表类型中文映射 ====================
report_type_names:
  balance_sheet: "资产负债表"
  income_statement: "利润表"
  cash_flow: "现金流量表"
  equity_change: "所有者权益变动表"

# ==================== 名称清洗 ====================
name_cleaning:
  strip_prefix: ["其中：", "减：", "加："]
  remove_brackets: true
  trim_whitespace: true