<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集团财务组织树</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/jstree.min.css" />
    <link rel="stylesheet" href="/static/css/jquery-ui.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }
        .app-container { display: flex; height: 100vh; width: 100%; }

        /* 左侧树面板 */
        .sidebar {
            width: var(--sidebar-width, 340px);
            min-width: 240px; max-width: 70%;
            background: #fff;
            border-right: 1px solid #e8e8e8;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* 分隔条 */
        .divider {
            width: 5px; min-width: 5px;
            background: #ddd; cursor: col-resize;
            transition: background 0.15s;
            user-select: none;
        }
        .divider:hover, .divider.active {
            background: #2c3e50;
        }
        .sidebar-header {
            padding: 16px; background: #2c3e50; color: white;
            font-weight: 600; font-size: 16px;
        }
        .sidebar-header .period-selector {
            margin-top: 10px; display: flex; flex-direction: column; gap: 4px;
        }
        .sidebar-header .period-selector select {
            flex: 1; padding: 4px 6px; border: none; border-radius: 3px;
            font-size: 12px; background: #fff; color: #333;
        }
        .tree-search-bar {
            padding: 10px 12px; border-bottom: 1px solid #e8e8e8;
            background: #f9f9f9; display: flex; gap: 6px;
        }
        .tree-search-bar input {
            flex: 1; padding: 6px 10px; border: 1px solid #ddd;
            border-radius: 3px; font-size: 13px; outline: none;
        }
        .tree-search-bar input:focus { border-color: #2c3e50; }
        .tree-search-bar button {
            padding: 6px 10px; background: #f0f0f0; border: 1px solid #ddd;
            border-radius: 3px; cursor: pointer; font-size: 12px; color: #666;
        }
        .tree-search-bar button:hover { background: #e4e4e4; }

        /* 新增：日报生成栏 */
        .report-gen-bar {
            padding: 10px 12px;
            border-bottom: 1px solid #e8e8e8;
            background: #f9f9f9;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .report-gen-bar label {
            font-size: 11px; color: #555; white-space: nowrap;
        }
        .report-gen-bar input[type="date"] {
            padding: 4px 6px; border: 1px solid #ddd; border-radius: 3px;
            font-size: 12px; width: 130px;
        }
        .report-gen-bar button {
            padding: 5px 10px; border: none; border-radius: 3px; font-size: 12px;
            cursor: pointer; background: #2c3e50; color: #fff; white-space: nowrap;
        }
        .report-gen-bar button:hover { background: #1a2a36; }
        .report-gen-bar button.btn-send { background: #27ae60; }
        .report-gen-bar button.btn-send:hover { background: #219a52; }
        .report-gen-bar .gen-status {
            font-size: 11px; color: #2c3e50; margin-left: auto; flex-basis: 100%;
            margin-top: 4px;
        }
        .report-gen-bar .gen-status a {
            color: #4285f4; text-decoration: none;
        }
        .report-gen-bar .gen-status a:hover { text-decoration: underline; }

        .tree-wrapper { flex: 1; overflow-y: auto; padding: 8px; }

        /* 右侧内容 */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 20px; }
        .report-card {
            background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }
        .card-header {
            padding: 14px 20px; border-bottom: 1px solid #eef2f6;
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
        }
        .card-header h2 { font-size: 16px; font-weight: 600; color: #1f2f3a; }
        .card-header h2 span.org-badge {
            background: #2c3e50; color: #fff; font-size: 11px; font-weight: normal;
            padding: 2px 10px; border-radius: 20px; margin-left: 8px;
        }
        .filters-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .filters-row label { font-size: 12px; color: #5d6f83; }
        .filters-row select, .filters-row input {
            padding: 4px 8px; border: 1px solid #ddd; border-radius: 3px; font-size: 12px;
        }
        .filters-row button {
            padding: 5px 12px; border: none; border-radius: 3px; font-size: 12px; cursor: pointer;
        }
        .btn-refresh { background: #2c3e50; color: #fff; }
        .btn-export { background: #27ae60; color: #fff; }
        .btn-refresh:hover { background: #1a2a36; }
        .btn-export:hover { background: #1e8a4d; }
        .record-count { font-size: 12px; color: #8c9aab; margin-left: auto; }

        .table-container { flex: 1; overflow-y: auto; padding: 0 20px 16px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th {
            background: #f8fafd; padding: 10px 8px; text-align: left;
            font-weight: 600; color: #1f2f3a; border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 0; z-index: 1;
        }
        .data-table td { padding: 8px; border-bottom: 1px solid #f0f2f5; color: #2c3e50; }
        .data-table tr:hover td { background: #fafcff; }
        .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        .loading { text-align: center; padding: 60px 20px; color: #6c7a89; font-size: 14px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #8c9aab; }
        .empty-state small { font-size: 12px; }
        .footer-note {
            text-align: right; font-size: 11px; color: #9aa9b7;
            padding: 8px 20px; border-top: 1px solid #eef2f6;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c9d2; border-radius: 3px; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 左侧：组织树 + 日报生成 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div>📊 集团财务组织树</div>
            <div class="period-selector" style="flex-direction:column; gap:4px;">
                <div style="display:flex; align-items:center; gap:4px;">
                    <span style="font-size:11px; white-space:nowrap;">🌳组织</span>
                    <select id="treePeriodSelect" style="flex:1;"></select>
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                    <span style="font-size:11px; white-space:nowrap;">📅数据</span>
                    <select id="dataPeriodSelect" style="flex:1;"></select>
                </div>
            </div>
        </div>
        <div class="tree-search-bar">
            <input type="text" id="treeSearchInput" placeholder="搜索组织名称...">
            <button id="clearSearchBtn">清除</button>
        </div>
        <!-- 新增：日报生成区域 -->
        <div class="report-gen-bar">
            <label for="reportDate">📰 日报日期</label>
            <input type="date" id="reportDate" value="2026-07-31">
            <button id="genReportBtn">生成日报</button>
            <button id="sendReportBtn" class="btn-send">发送日报</button>
            <span class="gen-status" id="reportStatus"></span>
        </div>
        <div class="tree-wrapper">
            <div id="orgTree"></div>
        </div>
    </div>

    <!-- 可拖拽分隔条 -->
    <div class="divider" id="divider"></div>
    <!-- 右侧：财务数据 -->
    <div class="main-content">
        <div class="report-card">
            <div class="card-header">
                <h2>📑 <span id="reportTitle">财务指标详情</span> <span class="org-badge" id="selectedOrgBadge">未选择</span></h2>
                <div class="filters-row">
                    <label>报表类别:</label>
                    <select id="reportCategoryFilter">
                        <option value="">全部</option>
                        <optgroup label="财务报表">
                            <option value="利润表">利润表</option>
                            <option value="资产负债表">资产负债表</option>
                            <option value="现金流量表">现金流量表</option>
                            <option value="所有者权益变动表">所有者权益变动表</option>
                        </optgroup>
                        <optgroup label="司库数据">
                            <option value="treasury_account">账户情况表</option>
                        </optgroup>
                    </select>
                    <button class="btn-refresh" id="refreshBtn">刷新数据</button>
                    <button class="btn-export" id="exportBtn">导出 CSV</button>
                    <span class="record-count" id="recordCount">0 条记录</span>
                </div>
            </div>
            <div class="table-container" id="tableContainer">
                <div class="loading">💡 请从左侧选择一个组织节点</div>
            </div>
            <div class="footer-note">数据来源：集团财务系统</div>
        </div>
    </div>
</div>

<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/jstree.min.js"></script>
<script src="/static/js/jquery-ui.min.js"></script>

<script>
$(document).ready(function() {
    let currentTreePeriod = '';
    let currentDataPeriod = '';
    let currentOrgId = null;
    let currentTableData = [];

    // ========== 1. 加载两个下拉框 ==========
    function loadTreePeriods() {
        $.get('/api/tree_periods')
            .done(function(data) {
                var sel = $('#treePeriodSelect');
                sel.empty();
                if (data && data.length) {
                    data.forEach(function(p) {
                        sel.append('<option value="' + p.period_id + '">' + p.period_name + '</option>');
                    });
                    currentTreePeriod = data[0].period_id;
                    sel.val(currentTreePeriod);
                } else {
                    sel.append('<option value="">无树数据</option>');
                }
                initTree();
            });
    }

    function loadDataPeriods() {
        $.get('/api/periods')
            .done(function(data) {
                var sel = $('#dataPeriodSelect');
                sel.empty();
                if (data && data.length) {
                    data.forEach(function(p) {
                        sel.append('<option value="' + p.period_id + '">' + p.period_name + '</option>');
                    });
                    currentDataPeriod = data[0].period_id;
                    sel.val(currentDataPeriod);
                } else {
                    sel.append('<option value="">暂无月份数据</option>');
                }
            })
            .fail(function() {
                $('#dataPeriodSelect').html('<option value="">加载失败</option>');
            });
    }

    // ========== 2. 加载组织树 ==========
    function initTree() {
        if (!currentTreePeriod) return;
        $.get('/api/tree', { period: currentTreePeriod })
            .done(function(data) {
                $('#orgTree').jstree({
                    'core': { 'data': data || [], 'themes': { 'name': 'default', 'dots': true, 'icons': true } },
                    'search': { 'case_insensitive': true, 'show_only_matches': true },
                    'plugins': ['search', 'wholerow']
                }).on('ready.jstree', function() {
                    var tree = $('#orgTree').jstree(true);
                    var roots = tree.get_node('#').children;
                    if (roots && roots.length) tree.select_node(roots[0]);
                }).on('select_node.jstree', function(e, data) {
                    currentOrgId = data.node.id;
                    $('#selectedOrgBadge').text(data.node.text.substring(0, 20));
                    loadNodeData(data.node.id);
                });
            })
            .fail(function() {
                $('#orgTree').html('<div style="color:red;padding:12px;">组织树加载失败</div>');
            });
    }

    // ========== 3. 加载节点数据 ==========
    function loadNodeData(nodeId) {
        var container = $('#tableContainer');
        var cat = $('#reportCategoryFilter').val();
        var isTreasury = (cat === 'treasury_account');
        var url = isTreasury ? '/api/treasury_data' : '/api/node_data';

        container.html('<div class="loading">📡 加载数据中...</div>');

        $.get(url, { node_id: nodeId, tree_period: currentTreePeriod, data_period: currentDataPeriod })
            .done(function(records) {
                if (isTreasury) {
                    currentTableData = records || [];
                    renderTreasuryAccountTable(currentTableData);
                    $('#reportTitle').text('账户情况详情');
                } else {
                    currentTableData = records || [];
                    renderTable(currentTableData);
                    $('#reportTitle').text('财务指标详情');
                }
            })
            .fail(function() {
                container.html('<div class="loading" style="color:#d9534f;">❌ 数据加载失败</div>');
            });
    }

    // ========== 4. 渲染财务表格 ==========
    function renderTable(data) {
        var container = $('#tableContainer');
        if (!data || data.length === 0) {
            container.html('<div class="empty-state">📭 该节点暂无财务数据</div>');
            $('#recordCount').text('0 条记录');
            return;
        }

        var html = '<table class="data-table"><thead><tr>' +
            '<th>原始指标名称</th><th>标准路径</th>' +
            '<th class="num">本月数</th><th class="num">上年同期</th><th class="num">本年累计</th>' +
            '<th>报表类别</th><th>指标名称</th>' +
            '<th>标准对比键</th><th>原始对比键</th><th>匹配</th></tr></thead><tbody>';

        data.forEach(function(r) {
            var matched = r['是否匹配'];
            html += '<tr>' +
                '<td style="font-size:12px;color:#666;">' + (r['原始指标名称'] || '-') + '</td>' +
                '<td style="font-size:12px;color:#666;">' + (r['标准路径'] || '-') + '</td>' +
                '<td class="num">' + fmtNum(r['本月数']) + '</td>' +
                '<td class="num">' + fmtNum(r['上年同期']) + '</td>' +
                '<td class="num">' + fmtNum(r['本年累计']) + '</td>' +
                '<td>' + (r['报表类别'] || '-') + '</td>' +
                '<td>' + (r['指标名称'] || '-') + '</td>' +
                '<td>' + (r['标准对比键'] || '-') + '</td>' +
                '<td>' + (r['原始对比键'] || '-') + '</td>' +
                '<td>' + (matched ? '✅' : '❌') + '</td>' +
                '</tr>';
        });

        html += '</tbody></table>';
        container.html(html);
        $('#recordCount').text(data.length + ' 条记录');
    }

    function fmtNum(v) {
        if (v === null || v === undefined || v === '') return '-';
        var n = parseFloat(v);
        return isNaN(n) ? v : n.toFixed(2);
    }

    // ========== 4b. 渲染司库账户表格 ==========
    function renderTreasuryAccountTable(data) {
        var container = $('#tableContainer');
        if (!data || data.length === 0) {
            container.html('<div class="empty-state">📭 该节点暂无账户数据</div>');
            $('#recordCount').text('0 条记录');
            return;
        }

        var html = '<table class="data-table"><thead><tr>' +
            '<th>账户编号</th><th>账户名称</th><th>开户银行</th>' +
            '<th>账户类型</th><th>币种</th>' +
            '<th class="num">期末余额</th><th class="num">可用余额</th>' +
            '<th>余额日期</th><th>合作银行</th><th>境外</th></tr></thead><tbody>';

        data.forEach(function(r) {
            html += '<tr>' +
                '<td>' + (r['账户编号'] || '-') + '</td>' +
                '<td>' + (r['账户名称'] || '-') + '</td>' +
                '<td>' + (r['开户银行'] || '-') + '</td>' +
                '<td>' + (r['账户类型'] || '-') + '</td>' +
                '<td>' + (r['币种'] || '-') + '</td>' +
                '<td class="num">' + fmtNum(r['期末余额']) + '</td>' +
                '<td class="num">' + fmtNum(r['可用余额']) + '</td>' +
                '<td>' + (r['余额日期'] || '-') + '</td>' +
                '<td>' + (r['是否合作银行'] || '-') + '</td>' +
                '<td>' + (r['是否境外账户'] || '-') + '</td>' +
                '</tr>';
        });

        html += '</tbody></table>';
        container.html(html);
        $('#recordCount').text(data.length + ' 条记录');
    }

    // ========== 5. 月份切换 ==========
    $('#treePeriodSelect').on('change', function() {
        currentTreePeriod = $(this).val();
        if ($('#orgTree').jstree(true)) $('#orgTree').jstree('destroy');
        initTree();
    });

    $('#dataPeriodSelect').on('change', function() {
        currentDataPeriod = $(this).val();
        if (currentOrgId) loadNodeData(currentOrgId);
    });

    // ========== 6. 刷新 ==========
    $('#refreshBtn').on('click', function() {
        if (currentOrgId) loadNodeData(currentOrgId);
    });

    // ========== 7. 报表类别筛选 ==========
    $('#reportCategoryFilter').on('change', function() {
        var cat = $(this).val();
        if (cat === 'treasury_account') {
            if (currentOrgId) loadNodeData(currentOrgId);
            return;
        }
        if (!currentTableData.length) return;
        if (!cat) {
            renderTable(currentTableData);
            $('#reportTitle').text('财务指标详情');
            return;
        }
        var filtered = currentTableData.filter(function(r) { return r['报表类别'] === cat; });
        renderTable(filtered);
        $('#reportTitle').text('财务指标详情');
    });

    // ========== 8. 导出 ==========
    $('#exportBtn').on('click', function() {
        if (!currentTableData || !currentTableData.length) { alert('没有数据可导出'); return; }
        var csv = '\uFEFF';
        var isTreasury = ($('#reportCategoryFilter').val() === 'treasury_account');
        var headers, prefix;

        if (isTreasury) {
            headers = ['账户编号', '账户名称', '开户银行', '账户类型', '币种', '期末余额', '可用余额', '余额日期', '是否合作银行', '是否境外账户'];
            prefix = '账户数据';
        } else {
            headers = ['原始指标名称', '标准路径', '本月数', '上年同期', '本年累计', '报表类别', '指标名称', '标准对比键', '原始对比键', '是否匹配'];
            prefix = '财务数据';
        }

        csv += headers.join(',') + '\n';
        currentTableData.forEach(function(r) {
            headers.forEach(function(h, i) {
                if (i > 0) csv += ',';
                csv += '"' + (r[h] ?? '') + '"';
            });
            csv += '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = prefix + '_' + currentDataPeriod + '_' + (currentOrgId || 'unknown') + '.csv';
        link.click();
        URL.revokeObjectURL(link.href);
    });

    // ========== 9. 树搜索 ==========
    $('#treeSearchInput').on('input', function() {
        var q = $(this).val().trim();
        var tree = $('#orgTree').jstree(true);
        if (!tree) return;
        if (!q) tree.clear_search();
        else tree.search(q);
    });
    $('#clearSearchBtn').on('click', function() {
        $('#treeSearchInput').val('');
        var tree = $('#orgTree').jstree(true);
        if (tree) tree.clear_search();
    });

    // ========== 10. 日报生成 ==========
    $('#genReportBtn').on('click', function() {
        var dateVal = $('#reportDate').val();
        if (!dateVal) { alert('请选择日报日期'); return; }
        var parts = dateVal.split('-');
        var year = parts[0], month = parts[1], day = parts[2];

        var btn = $(this);
        btn.prop('disabled', true).text('生成中...');
        $('#reportStatus').html('<span style="color:#4285f4;">⏳ 正在生成报告，请稍后...</span>');

        $.getJSON('/api/generate_report', { year: year, month: month, day: day })
            .done(function(data) {
                if (data.success) {
                    $('#reportStatus').html('<a href="' + data.url + '" download>📥 点击下载报告</a>');
                } else {
                    $('#reportStatus').html('<span style="color:#d9534f;">❌ 生成失败：' + (data.error || '未知错误') + '</span>');
                }
            })
            .fail(function() {
                $('#reportStatus').html('<span style="color:#d9534f;">❌ 请求失败，请检查后端日志</span>');
            })
            .always(function() {
                btn.prop('disabled', false).text('生成日报');
            });
    });

    // ========== 10b. 发送日报 ==========
    $('#sendReportBtn').on('click', function() {
        var dateVal = $('#reportDate').val();
        if (!dateVal) { alert('请选择日报日期'); return; }
        var parts = dateVal.split('-');
        var year = parts[0], month = parts[1], day = parts[2];

        var btn = $(this);
        btn.prop('disabled', true).text('发送中...');
        $('#reportStatus').html('<span style="color:#4285f4;">⏳ 正在发送日报，请稍后...</span>');

        $.getJSON('/api/send_report', { year: year, month: month, day: day })
            .done(function(data) {
                if (data.success) {
                    var msg = '✅ 邮件已发送至 ' + (data.to || '收件人');
                    if (data.generated) msg += ' (已自动生成PDF)';
                    $('#reportStatus').html('<span style="color:#27ae60;">' + msg + '</span>');
                } else {
                    $('#reportStatus').html('<span style="color:#d9534f;">❌ 发送失败：' + (data.error || '未知错误') + '</span>');
                }
            })
            .fail(function() {
                $('#reportStatus').html('<span style="color:#d9534f;">❌ 请求失败，请检查后端日志</span>');
            })
            .always(function() {
                btn.prop('disabled', false).text('发送日报');
            });
    });

    // ========== 分隔条拖拽 ==========
    (function() {
        var divider = document.getElementById("divider");
        var sidebar = document.getElementById("sidebar");
        var container = document.querySelector(".app-container");
        var isDragging = false;
        var startX, startWidth;

        divider.addEventListener("mousedown", function(e) {
            isDragging = true;
            startX = e.clientX;
            startWidth = sidebar.getBoundingClientRect().width;
            divider.classList.add("active");
            document.body.style.cursor = "col-resize";
            document.body.style.userSelect = "none";
            e.preventDefault();
        });

        document.addEventListener("mousemove", function(e) {
            if (!isDragging) return;
            var dx = e.clientX - startX;
            var newWidth = startWidth + dx;
            // 最小 200px，最大 container 的 70%
            var maxWidth = container.getBoundingClientRect().width * 0.7;
            newWidth = Math.max(200, Math.min(newWidth, maxWidth));
            sidebar.style.width = newWidth + "px";
        });

        document.addEventListener("mouseup", function() {
            if (!isDragging) return;
            isDragging = false;
            divider.classList.remove("active");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            // 保存宽度到 localStorage
            localStorage.setItem("sidebar-width", sidebar.style.width);
        });

        // 恢复保存的宽度
        var savedWidth = localStorage.getItem("sidebar-width");
        if (savedWidth) sidebar.style.width = savedWidth;
    })();

    // ========== 启动 ==========
    loadTreePeriods();
    loadDataPeriods();
});
</script>
</body>
</html>
