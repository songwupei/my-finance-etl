[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my_finance_etl"
version = "1.6.0"
description = "财务数据ETL与可视化平台 — Vizro + Shiny 双引擎"
authors = [{name = "Song"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "kedro>=0.19.0",
    "kedro-datasets>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "duckdb>=0.9.0",
    "flask>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "vizro>=0.1.0",
    "dash>=2.0.0",
    "shiny>=1.0.0",
    "shinywidgets>=0.3.0",
    "faicons>=0.2.0",
    "numpy>=1.24.0",
    "plotly>=5.0.0",
    "polars>=1.0.0",
    "polars-etl-kit>=0.1.0",
    "great-tables>=0.21.0",
    "querychat>=0.6.0",
    "anthropic>=0.100.0",
]

[project.scripts]
my-finance-etl = "src.my_finance_etl.__main__:main"
my-finance-web = "src.my_finance_web:main"
my-finance-shiny = "src.my_finance_shiny.app:main"

[tool.kedro]
package_name = "my_finance_etl"
project_name = "My Finance ETL"
kedro_init_version = "1.1.1"
source_dir = "src"
[tool.kedro_telemetry]
project_id = "15cdd40a1cac4da4a6065c58bd8d7f0a"
