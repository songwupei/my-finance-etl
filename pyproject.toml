[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my_finance_etl"
version = "1.6.6"
description = "AI驱动财务数据ETL与可视化平台 — Vizro + Shiny + MapLibre 三引擎 + LLM 智能查询"
authors = [{name = "Song Wupei", email = "songwupei@qq.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["finance", "etl", "kedro", "vizro", "shiny", "duckdb", "polars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "kedro>=0.19.0",
    "kedro-datasets>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "duckdb>=0.9.0",
    "flask>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "vizro>=0.1.0",
    "dash>=2.0.0",
    "shiny>=1.0.0",
    "shinywidgets>=0.3.0",
    "libsass>=0.23.0",
    "faicons>=0.2.0",
    "numpy>=1.24.0",
    "plotly>=5.0.0",
    "polars>=1.0.0",
    "polars-etl-kit>=0.2.0",
    "great-tables>=0.21.0",
    "querychat>=0.6.0",
    "anthropic>=0.100.0",
    "filepulse>=0.1.0",
    "geocode-amap>=0.1.0",
    "mailops>=0.2.0",
]

[project.urls]
Homepage = "https://codeberg.org/songwupei/skdata-etl"
Repository = "https://codeberg.org/songwupei/skdata-etl"
Issues = "https://codeberg.org/songwupei/skdata-etl/issues"

[project.scripts]
my-finance-etl = "src.my_finance_etl.__main__:main"
my-finance-web = "src.my_finance_web:main"
my-finance-shiny = "src.my_finance_shiny.app:main"

[tool.kedro]
package_name = "my_finance_etl"
project_name = "My Finance ETL"
kedro_init_version = "1.1.1"
source_dir = "src"
[tool.kedro_telemetry]
project_id = "15cdd40a1cac4da4a6065c58bd8d7f0a"
